# formalization.yaml (v0.4): repo-root metadata for FormalQuantumComputation.

version: "v0.4"

project:
  name: "formal-quantum-computation"
  description: |-
    A Lean 4 library for formally specifying and verifying quantum programs,
    grounded in quantum Hoare logic with classical variables (Feng and Ying, 2021).
    `QuantumComputation` is the core library: circuits, gates, registers, and
    the underlying mathematics; total-correctness quantum Hoare logic; a
    compositional expected-cost framework, including unbounded loops; and
    verified algorithms.
    `QuantumComputationSpecs` is a separate library of
    [Comparator](https://github.com/leanprover/comparator) specifications and
    benchmark challenges for automated theorem proving and AI-assisted
    quantum program discovery.
  authors: &authors
    - "Sergey Shirobokov"
    - "Ben Jaderberg"
    - "Katerina Hristova"
    - "George Tsoukalas"
