automation:
  methods:
    - method: "manual"
      tool_setup: >-
        Hand-written core definitions, quantum Hoare logic framework and
        Comparator specifications.
    - method: "agent"
      tool_setup: >-
        Interactive AI coding agents operating with Lean compiler, linter, and
        test feedback during library formalization, refactoring, and
        specification engineering, subject to human maintainer review and human-led 
        in depth AI review.
    - method: "autonomous"
      tool_setup: >-
        Gemini 4 multi-agent discovery runs (agent teams with shared wikis and
        scheduled conferences) producing solutions to the
        `QuantumComputationSpecs/ChallengeJsons/` specifications, checked in a
        sandbox via [Comparator](https://github.com/leanprover/comparator).
  notes: >-
    AI-discovered solutions are described in
    [arXiv:2611.09822](https://arxiv.org/abs/2611.09822) and kept on the
    separate `discoveries` branch.

fidelity:
  divergences: |-
    The formalization makes the following deliberate
    design adaptations diverging from Feng and Ying, 2021. These are documented in Appendix A of
    [arXiv:2611.09822](https://arxiv.org/abs/2611.09822) and module docstrings:

    1. **Integer stores, shallow expressions and guards** (Defs 3.1, §4.1).
       Classical variables are integer-only (`Store Var := Var → ℤ`);
       expressions are Lean functions `Store Var → ℤ` and guards are decidable
       predicates `Store Var → Prop`.
    2. **No random assignment** (§4.1). `x :=_$ g` is omitted.
    3. **One Hilbert space instead of named quantum variables** (§3.1).
       Instead of named quantum variables `qVar`, `QProg Var d` acts on a single
       `d`-dimensional system, where `d` is a positive natural number, 
       with multi-qubit subsystems addressed via `QRegister k n` embeddings.
    4. **`CQState` without explicit countable support** (Def 3.1). Defined via
       `HasSum` over all classical states; equivalent to the paper's
       definition by `CQState.equivSubtypeSupportCountable`.
    5. **`CQAssertion` as the full function space** (Def 3.5).
       `State → Observable (Fin d)`, dropping countable-range and definability
       conditions so assertions are closed under ω-suprema; equivalent to the
       paper's definition for finite `Var` by `CQAssertion.equivCountable`.

review:
  status: "self-assessed"
  notes: >-
    Every pull request receives both AI code review and human maintainer
    review, alongside automated build, linter, and Comparator configuration
    CI (custom `check_challenge_jsons` specification validator).
