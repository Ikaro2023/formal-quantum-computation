    authors:
      - "Yuan Feng"
      - "Mingsheng Ying"
    id: "https://doi.org/10.1145/3456877"
    type: "article"
    location: "Sections 3, 4.1–4.4, 7.1, and 7.2"
    relationship: "adapts"
    note: >-
      Basis for classical-quantum states, assertions, expectation, denotational semantics,
